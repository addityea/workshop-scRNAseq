# Pixi workspace for the Seurat/Bioconductor lab image.
# Adapted from the previous Conda environment: same package pins as
# containers/conda/seurat-bioc-environment-2025.yaml
# (Bioconductor 3.19 / R 4.3.3 vintage), now solved and locked by pixi.
# The image installs this frozen at build time and exposes the env at
# /usr/local/conda/envs/seurat (symlink), which is the path the Seurat and
# Bioconductor labs hardcode as basilisk `condapath`. The start script puts
# the env on PATH; conda itself is not installed.
[workspace]
authors = ["Aditya Singh <aditya.singh@nbis.se>"]
channels = ["conda-forge", "bioconda"]
name = "seurat-bioc-2026"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# basilisk (and the labs' basiliskRun(env=condapath, ...) calls) resolves a
# pre-built env through the conda BINARY (reticulate::use_condaenv). Ship it
# in the env so that works without any conda installation, envs or shell
# hooks existing on the image.
conda = ">=24,<27"
bioconductor-basilisk = "==1.14.1"
bioconductor-batchelor = "==1.18.0"
bioconductor-biobase = "==2.62.0"
bioconductor-biomart = "==2.58.0"
bioconductor-bluster = "==1.12.0"
"bioconductor-bsgenome.hsapiens.ucsc.hg38" = "==1.4.5"
bioconductor-celldex = "==1.12.0"
bioconductor-edger = "==4.0.16"
"bioconductor-ensdb.hsapiens.v86" = "==2.99.0"
bioconductor-fgsea = "==1.28.0"
bioconductor-glmgampoi = "==1.14.0"
bioconductor-jaspar2020 = "==0.99.10"
bioconductor-mast = "==1.28.0"
"bioconductor-org.hs.eg.db" = "==3.18.0"
bioconductor-scater = "==1.30.1"
bioconductor-scdblfinder = "==1.16.0"
bioconductor-scmap = "==1.24.0"
bioconductor-scran = "==1.30.0"
bioconductor-singler = "==2.4.0"
bioconductor-slingshot = "==2.10.0"
