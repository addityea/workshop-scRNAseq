[workspace]
authors = ["Susanne Reinsbach <susanne.reinsbach@scilifelab.se>"]
channels = ["conda-forge", "bioconda"]
name = "scanpy-2026"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
anndata = ">=0.12.10,<0.13"
bbknn = ">=1.6.0,<2"
cellrank = ">=2.0.7,<3"
celltypist = ">=1.7.1,<2"
fa2_modified = "==0.4"
gseapy = ">=1.1.11,<2"
harmonypy = ">=0.2.0,<0.3"
ipykernel = ">=7.2.0,<8"
# JupyterLab itself lives in the Pixi env so the conda runtime of the
# serve-jupyterlab-minimal base can be deleted from the image entirely.
jupyterlab = ">=4.3,<5"
leidenalg = ">=0.11.0,<0.12"
matplotlib-base = ">=3.10.8,<4"
matplotlib-venn = ">=1.1.2,<2"
numpy = ">=2.3.5,<3"
pandas = ">=2.3.3,<3"
pip = ">=26.0.1,<27"
# scvi-tools imports pydantic at runtime, but the solver does not pull it
# into this environment (the 2025 lock lacked it too, silently breaking
# `import scvi`). Pin it explicitly.
pydantic = ">=2.7,<3"
pybiomart = ">=0.2.0,<0.3"
pygam = "==0.12.0"
python = ">=3.12.12,<3.13"
python-igraph = ">=1.0.0,<2"
scanorama = ">=1.7.4,<2"
scanpy = ">=1.12,<2"
scikit-learn = "==1.6.1"
scipy = ">=1.16.3,<2"
scrublet = ">=0.2.3,<0.3"
# scvi-tools has no lab usage today; it is kept deliberately because the
# 2026 integration course teaches it (see feature/integration-2026).
scvi-tools = ">=1.4.1,<2"
seaborn = ">=0.13.2,<0.14"
