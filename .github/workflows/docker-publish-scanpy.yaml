name: Build and Push Scanpy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Target Branch"
        required: true
        default: "main"
        type: string

env:
  GITHUB_ORG: ${{ github.repository_owner }}
  SCANPY_REPO_NAME: workshop-scrnaseq-scanpy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scanpy: ${{ steps.filter.outputs.scanpy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scanpy:
              - "containers/**/*scanpy*"
              - "containers/envs/scanpy/**"
              - "containers/patches/rosetta_fix/**"
              - "containers/scripts/**"

  # Each arch builds on a native runner (no QEMU), pushed under a
  # per-platform tag, then merged into one multi-arch manifest.
  build:
    needs: changes
    if: ${{ needs.changes.outputs.scanpy == 'true' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=scanpy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=scanpy-${{ matrix.arch }}
          context: ./containers
          file: ./containers/dockerfiles/scanpy.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ env.GITHUB_ORG }}/${{ env.SCANPY_REPO_NAME }}:arch-${{ matrix.arch }}
          push: true

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "date_tag=$(TZ=Europe/Stockholm date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$(echo ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Merge into multi-arch manifest
        run: |
          IMAGE=ghcr.io/${GITHUB_ORG}/${SCANPY_REPO_NAME}
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.tags.outputs.date_tag }}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ steps.tags.outputs.sha_tag }}" \
            "${IMAGE}:arch-amd64" "${IMAGE}:arch-arm64"
